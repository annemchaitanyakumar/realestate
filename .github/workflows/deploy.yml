name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: Production deployment is allowed only from main."
            exit 1
          fi

          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Preflight successful."

  deploy:
    name: Backup, Deploy and Verify
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/paanchajanyarealty.com"
            BACKUP_ROOT="$HOME/deploy-backups/paanchajanyarealty.com"
            BACKUP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz"
            CONFIG_BACKUP_DIR="$HOME/production-config-backup"
            CONFIG_BACKUP="$CONFIG_BACKUP_DIR/db.php"
            TARGET_COMMIT="${{ github.sha }}"

            BACKUP_READY=0
            DEPLOY_STARTED=0
            RESTORE_DIR=""
            TEMP_DB=""

            cleanup_temporary_files() {
              set +e

              if [ -n "$TEMP_DB" ]; then
                rm -f "$TEMP_DB"
              fi

              if [ -n "$RESTORE_DIR" ] && [ -d "$RESTORE_DIR" ]; then
                rm -rf "$RESTORE_DIR"
              fi
            }

            rollback() {
              STATUS=$?
              trap - ERR
              set +e

              echo "======================================"
              echo "Deployment failed. Starting rollback."
              echo "======================================"

              if [ "$BACKUP_READY" -ne 1 ] ||
                 [ ! -s "$BACKUP_ARCHIVE" ]; then
                echo "CRITICAL: A valid application backup is unavailable."
                echo "Manual recovery is required."
                exit 1
              fi

              RESTORE_DIR="$(mktemp -d "$HOME/deploy-restore.XXXXXX")"

              if ! tar -xzf "$BACKUP_ARCHIVE" -C "$RESTORE_DIR"; then
                echo "CRITICAL: Could not extract the backup."
                echo "Backup retained at: $BACKUP_ARCHIVE"
                exit 1
              fi

              if [ ! -d "$RESTORE_DIR/.git" ] &&
                 [ ! -d "$APP_DIR/.git" ]; then
                echo "CRITICAL: Git repository metadata is unavailable."
                exit 1
              fi

              if ! rsync -a --delete \
                   --exclude='/.git/' \
                   "$RESTORE_DIR/" "$APP_DIR/"; then
                echo "CRITICAL: Application rollback failed."
                echo "Backup retained at: $BACKUP_ARCHIVE"
                echo "Restore directory: $RESTORE_DIR"
                exit 1
              fi

              # Independently restore the production database configuration.
              if [ -s "$CONFIG_BACKUP" ]; then
                install -o "$(id -un)" -g www-data -m 640 \
                  "$CONFIG_BACKUP" "$APP_DIR/includes/db.php"
              elif [ -s "$RESTORE_DIR/includes/db.php" ]; then
                install -o "$(id -un)" -g www-data -m 640 \
                  "$RESTORE_DIR/includes/db.php" "$APP_DIR/includes/db.php"
              else
                echo "CRITICAL: Database configuration could not be restored."
                exit 1
              fi

              echo "Previous application files restored."
              echo "Database configuration restored."
              echo "Backup retained at: $BACKUP_ARCHIVE"

              cleanup_temporary_files
              exit "$STATUS"
            }

            echo "======================================"
            echo "Starting production deployment"
            echo "======================================"

            cd "$APP_DIR"

            # Validate the repository and deployment target.
            git rev-parse --is-inside-work-tree
            git fetch origin main

            OLD_COMMIT="$(git rev-parse HEAD)"
            NEW_COMMIT="$(git rev-parse FETCH_HEAD)"

            echo "Previous commit: $OLD_COMMIT"
            echo "Target commit:   $TARGET_COMMIT"
            echo "Remote commit:   $NEW_COMMIT"

            if [ "$NEW_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Remote main does not match workflow commit."
              exit 1
            fi

            # Validate the existing production database configuration.
            # Recover it from the independent protected copy if necessary.
            install -d -m 700 "$CONFIG_BACKUP_DIR"

            if [ ! -s "$APP_DIR/includes/db.php" ]; then
              if [ -s "$CONFIG_BACKUP" ]; then
                echo "Restoring missing database configuration from protected copy."

                install -d -o "$(id -un)" -g www-data -m 750 \
                  "$APP_DIR/includes"

                install -o "$(id -un)" -g www-data -m 640 \
                  "$CONFIG_BACKUP" "$APP_DIR/includes/db.php"
              else
                echo "ERROR: includes/db.php and its protected copy are both missing."
                echo "Refusing to deploy."
                exit 1
              fi
            fi

            # Refresh the independent copy from the validated live configuration.
            TEMP_DB="$(mktemp "$CONFIG_BACKUP_DIR/db.php.XXXXXX")"
            install -o "$(id -un)" -g www-data -m 640 \
              "$APP_DIR/includes/db.php" "$TEMP_DB"
            chmod 600 "$TEMP_DB"
            mv -f "$TEMP_DB" "$CONFIG_BACKUP"
            TEMP_DB=""

            test -s "$CONFIG_BACKUP"
            echo "Protected database configuration verified."

            # Create a complete pre-deployment application backup.
            install -d -m 700 "$BACKUP_ROOT"

            TEMP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz.tmp"
            rm -f "$TEMP_ARCHIVE"

            tar \
              --exclude='./.git' \
              -czf "$TEMP_ARCHIVE" \
              -C "$APP_DIR" .

            test -s "$TEMP_ARCHIVE"

            # Verify that the archive contains the production DB configuration.
            if ! tar -tzf "$TEMP_ARCHIVE" |
                 grep -Fxq './includes/db.php'; then
              echo "ERROR: Application backup does not contain includes/db.php."
              echo "Matching archive entries:"
              tar -tzf "$TEMP_ARCHIVE" | grep 'db\.php' || true
              rm -f "$TEMP_ARCHIVE"
              exit 1
            fi

            # Verify that the archive is readable before publishing it.
            tar -tzf "$TEMP_ARCHIVE" > /dev/null
            chmod 600 "$TEMP_ARCHIVE"
            mv -f "$TEMP_ARCHIVE" "$BACKUP_ARCHIVE"

            test -s "$BACKUP_ARCHIVE"
            BACKUP_READY=1

            echo "Application backup created and verified."
            echo "Backup: $BACKUP_ARCHIVE"

            # Enable automatic rollback before modifying application files.
            trap rollback ERR
            DEPLOY_STARTED=1

            # Force tracked files to match the requested commit.
            git reset --hard "$TARGET_COMMIT"

            # Remove untracked and ignored files, preserving production data,
            # environment configuration and runtime dependencies.
            git clean -fdx \
              -e '.env' \
              -e '.env.*' \
              -e 'uploads/' \
              -e 'storage/' \
              -e 'includes/db.php' \
              -e 'admin/.env' \
              -e 'admin/storage/' \
              -e 'admin/bootstrap/cache/' \
              -e 'admin/public/storage' \
              -e 'admin/vendor/' \
              -e 'admin/public/build/'

            # Restore the production-only database file from its independent copy.
            install -d -o "$(id -un)" -g www-data -m 750 includes

            install -o "$(id -un)" -g www-data -m 640 \
              "$CONFIG_BACKUP" includes/db.php

            test -s includes/db.php
            echo "Production database configuration restored."

            # Confirm that the repository is at the requested commit.
            ACTUAL_COMMIT="$(git rev-parse HEAD)"

            if [ "$ACTUAL_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Deployed commit does not match target."
              exit 1
            fi

            echo "Deployed commit: $ACTUAL_COMMIT"

            # Verify required production files.
            test -s admin/.env
            test -s includes/db.php
            test -f admin/artisan
            test -f admin/vendor/autoload.php

            # Verify that Laravel can bootstrap.
            php admin/artisan --version

            # Verify the public website responds successfully.
            curl --fail --silent --show-error --location \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              --max-time 20 \
              https://paanchajanyarealty.com/ \
              -o /dev/null

            # Verify the admin URL as well.
            curl --fail --silent --show-error --location \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              --max-time 20 \
              https://paanchajanyarealty.com/admin/ \
              -o /dev/null

            # All deployment checks passed.
            trap - ERR

            echo "======================================"
            echo "Deployment verification successful"
            echo "======================================"

            # Remove the temporary application snapshot only after success.
            rm -f "$BACKUP_ARCHIVE"

            echo "Temporary application backup removed."
            echo "Independent DB configuration backup retained at:"
            echo "$CONFIG_BACKUP"
            echo "Production deployment completed."
