
name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate deployment target
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "ERROR: Deployment is restricted to main."
            exit 1
          }

          echo "Target commit: ${GITHUB_SHA}"

      - name: Deploy and stabilize via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GITHUB_SHA
          command_timeout: 25m
          script_stop: true
          script: |
            set -eu

            APP_DIR="/var/www/paanchajanyarealty.com"
            BACKUP_DIR="$HOME/production-config-backup/paanchajanyarealty.com"
            TARGET_COMMIT="$GITHUB_SHA"

            echo "=========================================="
            echo "Starting production deployment"
            echo "Commit: $TARGET_COMMIT"
            echo "=========================================="

            cd "$APP_DIR"

            # 1. Verify the repository.
            test "$(git rev-parse --is-inside-work-tree)" = "true"

            REMOTE_URL="$(git remote get-url origin)"
            echo "Repository: $REMOTE_URL"

            # 2. Back up production-only configuration.
            mkdir -p "$BACKUP_DIR"

            if [ -f includes/db.php ]; then
              mkdir -p "$BACKUP_DIR/includes"
              cp -p includes/db.php "$BACKUP_DIR/includes/db.php"
              echo "Backed up includes/db.php"
            elif [ -f "$BACKUP_DIR/includes/db.php" ]; then
              echo "Current database config is missing; saved backup exists."
            else
              echo "ERROR: No database configuration or backup exists."
              exit 1
            fi

            if [ -f admin/.env ]; then
              mkdir -p "$BACKUP_DIR/admin"
              cp -p admin/.env "$BACKUP_DIR/admin/.env"
              echo "Backed up admin/.env"
            elif [ -f "$BACKUP_DIR/admin/.env" ]; then
              echo "Current Laravel .env is missing; saved backup exists."
            else
              echo "ERROR: No Laravel .env or backup exists."
              exit 1
            fi

            # 3. Preserve uploaded slider images in a persistent backup.
            # Do not delete the live upload directory.
            if [ -d admin/storage/app/public ]; then
              mkdir -p "$BACKUP_DIR/admin-public-uploads"

              cp -an admin/storage/app/public/. \
                "$BACKUP_DIR/admin-public-uploads/"

              echo "Preserved upload backup without overwriting prior files."
            fi

            # 4. Fetch main and validate the requested commit.
            git fetch origin main

            git cat-file -e "${TARGET_COMMIT}^{commit}" || {
              echo "ERROR: Target commit is not available locally."
              exit 1
            }

            git merge-base --is-ancestor "$TARGET_COMMIT" origin/main || {
              echo "ERROR: Target commit is not part of origin/main."
              echo "No production checkout was changed."
              exit 1
            }

            # 5. Deploy the exact commit.
            git reset --hard "$TARGET_COMMIT"

            test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"

            echo "Checked out commit: $(git rev-parse HEAD)"

            # 6. Restore production-only files only if absent.
            if [ ! -f includes/db.php ]; then
              mkdir -p includes
              cp -p "$BACKUP_DIR/includes/db.php" includes/db.php
              echo "Restored includes/db.php"
            fi

            if [ ! -f admin/.env ]; then
              cp -p "$BACKUP_DIR/admin/.env" admin/.env
              echo "Restored admin/.env"
            fi

            # 7. Ensure the database config has the expected group.
            # Do not attempt an unprivileged chgrp operation.
            if [ "$(stat -c '%G' includes/db.php)" != "www-data" ]; then
              echo "ERROR: includes/db.php must belong to group www-data."
              echo "Correct its ownership once with administrator privileges."
              exit 1
            fi

            chmod 640 includes/db.php

            # 8. Restore missing uploaded files without overwriting
            # existing production uploads.
            if [ -d "$BACKUP_DIR/admin-public-uploads" ]; then
              mkdir -p admin/storage/app/public

              cp -an "$BACKUP_DIR/admin-public-uploads/." \
                admin/storage/app/public/

              echo "Verified upload preservation."
            fi

            # 9. Check that the stabilization script exists.
            test -f "$APP_DIR/.deploy-stablization.sh" || {
              echo "ERROR: Stabilization script is missing."
              exit 1
            }

            # The script handles Composer, Vite, Laravel runtime
            # preparation, and its configured application checks.
            # It must not perform another Git checkout or run git clean.
            cd "$APP_DIR"

            bash ./.deploy-stablization.sh "$TARGET_COMMIT"

            # 10. Confirm the final checkout is still the target.
            test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"

            echo "=========================================="
            echo "Deployment and stabilization completed."
            echo "Commit: $(git rev-parse HEAD)"
            echo "Backups: $BACKUP_DIR"
            echo "=========================================="
