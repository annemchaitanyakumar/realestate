name: Deploy to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: Production deployment is allowed only from main."
            exit 1
          fi

          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Preflight successful."

  deploy:
    name: Backup, Deploy and Verify
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/paanchajanyarealty.com"
            BACKUP_ROOT="$HOME/deploy-backups/paanchajanyarealty.com"
            BACKUP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz"
            CONFIG_BACKUP_DIR="$HOME/production-config-backup"
            CONFIG_BACKUP="$CONFIG_BACKUP_DIR/db.php"
            TARGET_COMMIT="${{ github.sha }}"

            BACKUP_READY=0
            DEPLOY_STARTED=0
            RESTORE_DIR=""
            TEMP_DB=""

            cleanup_temporary_files() {
              set +e

              if [ -n "$TEMP_DB" ]; then
                rm -f "$TEMP_DB"
              fi

              if [ -n "$RESTORE_DIR" ] && [ -d "$RESTORE_DIR" ]; then
                rm -rf "$RESTORE_DIR"
              fi
            }

            rollback() {
              STATUS=$?
              trap - ERR
              set +e

              echo "======================================"
              echo "Deployment failed. Starting rollback."
              echo "======================================"

              if [ "$BACKUP_READY" -ne 1 ] ||
                 [ ! -s "$BACKUP_ARCHIVE" ]; then
                echo "CRITICAL: A valid application backup is unavailable."
                echo "Manual recovery is required."
                exit 1
              fi

              RESTORE_DIR="$(mktemp -d "$HOME/deploy-restore.XXXXXX")"

              if ! tar -xzf "$BACKUP_ARCHIVE" -C "$RESTORE_DIR"; then
                echo "CRITICAL: Could not extract the backup."
                echo "Backup retained at: $BACKUP_ARCHIVE"
                exit 1
              fi

              if ! rsync -a --delete \
                   --exclude='/.git/' \
                   "$RESTORE_DIR/" "$APP_DIR/"; then
                echo "CRITICAL: Application rollback failed."
                echo "Backup retained at: $BACKUP_ARCHIVE"
                echo "Restore directory: $RESTORE_DIR"
                exit 1
              fi

              # Restore the database configuration independently.
              if [ -s "$CONFIG_BACKUP" ]; then
                cp "$CONFIG_BACKUP" "$APP_DIR/includes/db.php"
                chmod 640 "$APP_DIR/includes/db.php"
              elif [ -s "$RESTORE_DIR/includes/db.php" ]; then
                cp "$RESTORE_DIR/includes/db.php" "$APP_DIR/includes/db.php"
                chmod 640 "$APP_DIR/includes/db.php"
              else
                echo "CRITICAL: Database configuration could not be restored."
                exit 1
              fi

              echo "Previous application files restored."
              echo "Database configuration restored."
              echo "Backup retained at: $BACKUP_ARCHIVE"

              cleanup_temporary_files
              exit "$STATUS"
            }

            echo "======================================"
            echo "Starting production deployment"
            echo "======================================"

            # Validate the application directory and repository.
            cd "$APP_DIR"
            git rev-parse --is-inside-work-tree
            git fetch origin main

            OLD_COMMIT="$(git rev-parse HEAD)"
            NEW_COMMIT="$(git rev-parse FETCH_HEAD)"

            echo "Previous commit: $OLD_COMMIT"
            echo "Target commit:   $TARGET_COMMIT"
            echo "Remote commit:   $NEW_COMMIT"

            if [ "$NEW_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Remote main does not match workflow commit."
              exit 1
            fi

            # Prepare an independent, protected database configuration backup.
            install -d -m 700 "$CONFIG_BACKUP_DIR"

            # Recover the live file from the protected copy if it is missing.
            if [ ! -s "$APP_DIR/includes/db.php" ]; then
              if [ -s "$CONFIG_BACKUP" ]; then
                echo "Live database configuration missing; restoring protected copy."

                mkdir -p "$APP_DIR/includes"
                cp "$CONFIG_BACKUP" "$APP_DIR/includes/db.php"
                chmod 640 "$APP_DIR/includes/db.php"
              else
                echo "ERROR: Live and protected database configurations are missing."
                echo "Refusing to deploy."
                exit 1
              fi
            fi

            # Save the existing production configuration without changing ownership.
            TEMP_DB="$(mktemp "$CONFIG_BACKUP_DIR/db.php.XXXXXX")"
            cp "$APP_DIR/includes/db.php" "$TEMP_DB"
            chmod 600 "$TEMP_DB"
            mv -f "$TEMP_DB" "$CONFIG_BACKUP"
            TEMP_DB=""

            test -s "$CONFIG_BACKUP"
            echo "Independent database configuration backup verified."

            # Create a full application snapshot before changing any application files.
            install -d -m 700 "$BACKUP_ROOT"

            TEMP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz.tmp"
            rm -f "$TEMP_ARCHIVE"

            tar \
              --exclude='./.git' \
              -czf "$TEMP_ARCHIVE" \
              -C "$APP_DIR" .

            test -s "$TEMP_ARCHIVE"

            # Confirm the archive contains the production-only database file.
            if ! tar -tzf "$TEMP_ARCHIVE" |
                 grep -Fxq './includes/db.php'; then
              echo "ERROR: Application backup does not contain includes/db.php."
              echo "Matching archive entries:"
              tar -tzf "$TEMP_ARCHIVE" | grep 'db\.php' || true
              rm -f "$TEMP_ARCHIVE"
              exit 1
            fi

            # Verify archive readability before publishing the backup.
            tar -tzf "$TEMP_ARCHIVE" > /dev/null
            chmod 600 "$TEMP_ARCHIVE"
            mv -f "$TEMP_ARCHIVE" "$BACKUP_ARCHIVE"

            test -s "$BACKUP_ARCHIVE"
            BACKUP_READY=1

            echo "Application backup created and verified."

            # Enable rollback before changing tracked or untracked application files.
            trap rollback ERR
            DEPLOY_STARTED=1

            # Deploy the exact commit that triggered this workflow.
            git reset --hard "$TARGET_COMMIT"

            # Clean obsolete files while preserving production configuration,
            # Laravel runtime data and installed dependencies.
            git clean -fdx \
              -e '.env' \
              -e '.env.*' \
              -e 'uploads/' \
              -e 'storage/' \
              -e 'includes/db.php' \
              -e 'admin/.env' \
              -e 'admin/storage/' \
              -e 'admin/bootstrap/cache/' \
              -e 'admin/public/storage' \
              -e 'admin/vendor/' \
              -e 'admin/public/build/'

            # Restore the production database configuration.
            mkdir -p includes
            cp "$CONFIG_BACKUP" includes/db.php
            chmod 640 includes/db.php

            test -s includes/db.php
            echo "Production database configuration restored."

            # Verify the checked-out commit.
            ACTUAL_COMMIT="$(git rev-parse HEAD)"

            if [ "$ACTUAL_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Deployed commit does not match target."
              exit 1
            fi

            echo "Deployed commit: $ACTUAL_COMMIT"

            # Verify required files exist.
            test -s admin/.env
            test -s includes/db.php
            test -f admin/artisan
            test -f admin/vendor/autoload.php

            # Check Laravel bootstrap.
            php admin/artisan --version

            # Check the public website.
            curl --fail --silent --show-error --location \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              --max-time 20 \
              https://paanchajanyarealty.com/ \
              -o /dev/null

            # Check the admin URL.
            curl --fail --silent --show-error --location \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              --max-time 20 \
              https://paanchajanyarealty.com/admin/ \
              -o /dev/null

            # Disable rollback only after all checks pass.
            trap - ERR

            echo "======================================"
            echo "Deployment verification successful"
            echo "======================================"

            # Remove the application snapshot only after successful verification.
            rm -f "$BACKUP_ARCHIVE"

            echo "Temporary application backup removed."
            echo "Protected DB backup retained at: $CONFIG_BACKUP"
            echo "Production deployment completed."
