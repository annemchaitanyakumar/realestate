name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: Production deployment is allowed only from main."
            exit 1
          fi

          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

  deploy:
    name: Backup, Deploy and Verify
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/paanchajanyarealty.com"
            BACKUP_ROOT="$HOME/deploy-backups/paanchajanyarealty.com"
            BACKUP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz"
            CONFIG_DIR="$HOME/production-config-backup"
            CONFIG_BACKUP="$CONFIG_DIR/db.php"
            TARGET_COMMIT="${{ github.sha }}"

            BACKUP_READY=0
            DEPLOY_STARTED=0
            RESTORE_DIR=""
            TEMP_ARCHIVE=""
            TEMP_DB=""

            cleanup_temps() {
              set +e

              [ -z "$TEMP_ARCHIVE" ] || rm -f "$TEMP_ARCHIVE"
              [ -z "$TEMP_DB" ] || rm -f "$TEMP_DB"

              if [ -n "$RESTORE_DIR" ] && [ -d "$RESTORE_DIR" ]; then
                rm -rf "$RESTORE_DIR"
              fi
            }

            rollback() {
              STATUS=$?
              FAILED_LINE="${BASH_LINENO[0]:-unknown}"
              trap - ERR
              set +e

              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Failure line: $FAILED_LINE"
              echo "Exit code: $STATUS"
              echo "Starting rollback."
              echo "======================================"

              if [ "$DEPLOY_STARTED" -ne 1 ]; then
                echo "Application changes had not started."
                cleanup_temps
                exit "$STATUS"
              fi

              if [ "$BACKUP_READY" -ne 1 ] ||
                 [ ! -s "$BACKUP_ARCHIVE" ]; then
                echo "CRITICAL: No verified application backup is available."
                echo "Manual recovery is required."
                exit 1
              fi

              RESTORE_DIR="$(mktemp -d "$HOME/deploy-restore.XXXXXX")"

              if ! tar -xzf "$BACKUP_ARCHIVE" -C "$RESTORE_DIR"; then
                echo "CRITICAL: Backup extraction failed."
                echo "Backup retained: $BACKUP_ARCHIVE"
                exit 1
              fi

              if ! rsync -a --delete \
                   --exclude='/.git/' \
                   "$RESTORE_DIR/" "$APP_DIR/"; then
                echo "CRITICAL: Application restoration failed."
                echo "Backup retained: $BACKUP_ARCHIVE"
                echo "Restore directory: $RESTORE_DIR"
                exit 1
              fi

              if [ -s "$CONFIG_BACKUP" ]; then
                cp "$CONFIG_BACKUP" "$APP_DIR/includes/db.php"
                chmod 640 "$APP_DIR/includes/db.php"
              elif [ -s "$RESTORE_DIR/includes/db.php" ]; then
                cp "$RESTORE_DIR/includes/db.php" "$APP_DIR/includes/db.php"
                chmod 640 "$APP_DIR/includes/db.php"
              else
                echo "CRITICAL: Database configuration restoration failed."
                exit 1
              fi

              echo "Application files restored."
              echo "Database configuration restored."
              echo "Backup retained: $BACKUP_ARCHIVE"

              cleanup_temps
              exit "$STATUS"
            }

            echo "======================================"
            echo "Starting production deployment"
            echo "======================================"

            cd "$APP_DIR"
            git rev-parse --is-inside-work-tree
            git fetch origin main

            CURRENT_COMMIT="$(git rev-parse HEAD)"
            REMOTE_COMMIT="$(git rev-parse FETCH_HEAD)"

            echo "Previous commit: $CURRENT_COMMIT"
            echo "Target commit:   $TARGET_COMMIT"
            echo "Remote commit:   $REMOTE_COMMIT"

            if [ "$REMOTE_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Remote main does not match workflow commit."
              exit 1
            fi

            # Verify and preserve the production-only database configuration.
            install -d -m 700 "$CONFIG_DIR"

            if [ ! -s "$APP_DIR/includes/db.php" ]; then
              if [ -s "$CONFIG_BACKUP" ]; then
                mkdir -p "$APP_DIR/includes"
                cp "$CONFIG_BACKUP" "$APP_DIR/includes/db.php"
                chmod 640 "$APP_DIR/includes/db.php"
              else
                echo "ERROR: Live and protected database configurations are missing."
                exit 1
              fi
            fi

            TEMP_DB="$(mktemp "$CONFIG_DIR/db.php.XXXXXX")"
            cp "$APP_DIR/includes/db.php" "$TEMP_DB"
            chmod 600 "$TEMP_DB"
            mv -f "$TEMP_DB" "$CONFIG_BACKUP"
            TEMP_DB=""

            test -s "$CONFIG_BACKUP"
            echo "Independent database configuration backup verified."

            # Create and verify the application snapshot before changing files.
            install -d -m 700 "$BACKUP_ROOT"
            TEMP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz.tmp"
            rm -f "$TEMP_ARCHIVE"

            tar \
              --exclude='./.git' \
              -czf "$TEMP_ARCHIVE" \
              -C "$APP_DIR" .

            test -s "$TEMP_ARCHIVE"

            # Read the complete listing to avoid grep -q/pipefail issues.
            ARCHIVE_LIST="$(tar -tzf "$TEMP_ARCHIVE")"

            if ! printf '%s\n' "$ARCHIVE_LIST" |
                 grep -Fx './includes/db.php' > /dev/null; then
              echo "ERROR: Snapshot does not contain includes/db.php."
              printf '%s\n' "$ARCHIVE_LIST" |
                grep 'db\.php' || true
              exit 1
            fi

            tar -tzf "$TEMP_ARCHIVE" > /dev/null
            chmod 600 "$TEMP_ARCHIVE"
            mv -f "$TEMP_ARCHIVE" "$BACKUP_ARCHIVE"
            TEMP_ARCHIVE=""

            test -s "$BACKUP_ARCHIVE"
            BACKUP_READY=1

            echo "Application backup created and verified."

            # Install rollback handler before modifying application files.
            trap rollback ERR
            DEPLOY_STARTED=1

            echo "Deploying target commit..."
            git reset --hard "$TARGET_COMMIT"

            # Preserve production configuration and runtime dependencies.
            git clean -fdx \
              -e '.env' \
              -e '.env.*' \
              -e 'uploads/' \
              -e 'storage/' \
              -e 'includes/db.php' \
              -e 'admin/.env' \
              -e 'admin/storage/' \
              -e 'admin/bootstrap/cache/' \
              -e 'admin/public/storage' \
              -e 'admin/vendor/' \
              -e 'admin/public/build/'

            # Restore production database configuration after Git cleanup.
            mkdir -p includes
            cp "$CONFIG_BACKUP" includes/db.php
            chmod 640 includes/db.php

            # Verify deployment commit.
            ACTUAL_COMMIT="$(git rev-parse HEAD)"

            if [ "$ACTUAL_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Deployed commit does not match target."
              exit 1
            fi

            echo "Deployed commit: $ACTUAL_COMMIT"

            # Verification 1: Required files.
            echo "DIAGNOSTIC: Checking required files."

            for file in admin/.env includes/db.php admin/artisan admin/vendor/autoload.php; do
              if [ -s "$file" ]; then
                echo "PASS: $file"
              else
                echo "FAIL: $file is missing or empty."
                exit 21
              fi
            done

            # Verification 2: Laravel bootstrap.
            echo "DIAGNOSTIC: Checking Laravel bootstrap."

            if php admin/artisan --version; then
              echo "PASS: Laravel bootstrap."
            else
              echo "FAIL: Laravel bootstrap."
              exit 22
            fi

            # Verification 3: Public website.
            echo "DIAGNOSTIC: Checking public website."

            if curl --fail --silent --show-error --location \
              --retry 2 \
              --retry-delay 2 \
              --max-time 20 \
              https://paanchajanyarealty.com/ \
              -o /dev/null; then
              echo "PASS: Public website."
            else
              echo "FAIL: Public website HTTP check."
              exit 23
            fi

            # Verification 4: Admin URL.
            echo "DIAGNOSTIC: Checking admin URL."

            if curl --fail --silent --show-error --location \
              --retry 2 \
              --retry-delay 2 \
              --max-time 20 \
              https://paanchajanyarealty.com/admin/ \
              -o /dev/null; then
              echo "PASS: Admin URL."
            else
              echo "FAIL: Admin URL HTTP check."
              exit 24
            fi

            echo "All verification checks passed."

            # Disable rollback only after every verification succeeds.
            trap - ERR

            echo "======================================"
            echo "DEPLOYMENT VERIFICATION SUCCESSFUL"
            echo "======================================"

            rm -f "$BACKUP_ARCHIVE"

            echo "Temporary application backup removed."
            echo "Independent database backup retained: $CONFIG_BACKUP"
            echo "Production deployment completed."
