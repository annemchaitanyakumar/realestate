name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate deployment target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: Deployment is restricted to main."
            exit 1
          fi

          echo "Target commit: $GITHUB_SHA"

      - name: Deploy and stabilize via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GITHUB_SHA
          command_timeout: 25m
          script: |
            set -eu

            APP_DIR="/var/www/paanchajanyarealty.com"
            ROOT_INDEX="$APP_DIR/index.php"
            DEPLOY_SCRIPT="$APP_DIR/.deploy-stablization.sh"
            TARGET_COMMIT="$GITHUB_SHA"

            echo "=========================================="
            echo "Starting production deployment"
            echo "Commit: $TARGET_COMMIT"
            echo "=========================================="

            # Validate inputs and required server files.
            case "$TARGET_COMMIT" in
              *[!0-9a-fA-F]*|"")
                echo "ERROR: Invalid deployment commit SHA."
                exit 1
                ;;
            esac

            if [ "${#TARGET_COMMIT}" -ne 40 ]; then
              echo "ERROR: Deployment SHA must be 40 characters."
              exit 1
            fi

            test -d "$APP_DIR/.git" || {
              echo "ERROR: Git repository not found: $APP_DIR"
              exit 1
            }

            test -f "$ROOT_INDEX" || {
              echo "ERROR: Root index.php is missing: $ROOT_INDEX"
              exit 1
            }

            test -f "$DEPLOY_SCRIPT" || {
              echo "ERROR: Stabilization script is missing: $DEPLOY_SCRIPT"
              exit 1
            }

            # Hardcoded permission repair for the public root entry point.
            # PHP-FPM runs as www-data and must be able to read this file.
            echo "Setting permissions on root index.php"
            sudo -n chmod 644 "$ROOT_INDEX"

            ACTUAL_MODE="$(stat -c '%a' "$ROOT_INDEX")"
            if [ "$ACTUAL_MODE" != "644" ]; then
              echo "ERROR: Failed to set root index.php permissions."
              echo "Actual mode: $ACTUAL_MODE"
              exit 1
            fi

            echo "PASS: Root index.php permissions are 644."
            ls -l "$ROOT_INDEX"

            # The stabilization script handles:
            # - repository and commit validation
            # - backups of production-only configuration
            # - persistent upload backups
            # - exact commit checkout
            # - Composer and npm dependencies
            # - Vite asset build
            # - privileged permission repair
            # - Laravel, Nginx and HTTP smoke tests
            bash "$DEPLOY_SCRIPT" "$TARGET_COMMIT"

            # Reapply the hardcoded permission after deployment in case
            # checkout or another deployment step changed file permissions.
            echo "Reapplying root index.php permissions after stabilization"
            sudo -n chmod 644 "$ROOT_INDEX"

            ACTUAL_MODE="$(stat -c '%a' "$ROOT_INDEX")"
            if [ "$ACTUAL_MODE" != "644" ]; then
              echo "ERROR: Root index.php permissions are incorrect after deployment."
              echo "Actual mode: $ACTUAL_MODE"
              exit 1
            fi

            # Confirm that the requested commit is still deployed.
            ACTUAL_COMMIT="$(git -C "$APP_DIR" rev-parse HEAD)"

            if [ "$ACTUAL_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "ERROR: Deployed commit does not match target."
              echo "Expected: $TARGET_COMMIT"
              echo "Actual:   $ACTUAL_COMMIT"
              exit 1
            fi

            echo "=========================================="
            echo "Deployment and stabilization completed."
            echo "Root index.php mode: $ACTUAL_MODE"
            echo "Commit: $ACTUAL_COMMIT"
            echo "=========================================="
