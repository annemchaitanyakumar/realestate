
name: Deploy to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent two deployments from modifying the server simultaneously.
concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate workflow trigger
        run: |
          echo "======================================"
          echo "Production deployment preflight"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "======================================"

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Error: Deployment is allowed only from main."
            exit 1
          fi

  deploy:
    name: Backup and Deploy to Ubuntu
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Deploy with Backup and Rollback
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 12m

          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/paanchajanyarealty.com"
            BACKUP_ROOT="$HOME/deploy-backups/paanchajanyarealty.com"
            BACKUP_ARCHIVE="$BACKUP_ROOT/previous-site.tar.gz"

            rollback() {
              STATUS=$?

              trap - ERR
              set +e

              echo "======================================"
              echo "Deployment failed. Starting rollback."
              echo "======================================"

              if [ -f "$BACKUP_ARCHIVE" ]; then
                cd "$APP_DIR" || exit 1

                # Remove failed deployment files while preserving
                # environment configuration and runtime data.
                git reset --hard HEAD
                git clean -fdx \
                  -e '.env' \
                  -e '.env.*' \
                  -e 'uploads/' \
                  -e 'storage/'

                # Restore the previous application files.
                tar -xzf "$BACKUP_ARCHIVE" -C "$APP_DIR"

                echo "Previous application files restored."
              else
                echo "No backup archive exists; automatic rollback unavailable."
              fi

              exit "$STATUS"
            }

            trap rollback ERR

            echo "======================================"
            echo "Starting production deployment"
            echo "======================================"

            cd "$APP_DIR"

            # Ensure this is the expected Git repository.
            git rev-parse --is-inside-work-tree

            # Fetch the latest remote branch before changing files.
            git fetch origin main

            OLD_COMMIT="$(git rev-parse HEAD)"
            NEW_COMMIT="$(git rev-parse origin/main)"

            echo "Previous commit: $OLD_COMMIT"
            echo "Target commit:   $NEW_COMMIT"

            # Replace the previous backup on every deployment.
            mkdir -p "$(dirname "$BACKUP_ROOT")"
            rm -rf "$BACKUP_ROOT"
            mkdir -p "$BACKUP_ROOT"

            # Back up all application files, including local changes,
            # without copying Git's internal .git directory.
            tar \
              --exclude='./.git' \
              -czf "$BACKUP_ARCHIVE" \
              -C "$APP_DIR" .

            echo "Backup created: $BACKUP_ARCHIVE"

            # Force the tracked code to match the remote main branch.
            git reset --hard origin/main

            # Remove untracked and ignored files that are not preserved.
            # The environment and runtime directories are excluded.
            git clean -fdx \
              -e '.env' \
              -e '.env.*' \
              -e 'uploads/' \
              -e 'storage/'

            # Verify the checkout matches the intended commit.
            ACTUAL_COMMIT="$(git rev-parse HEAD)"

            if [ "$ACTUAL_COMMIT" != "$NEW_COMMIT" ]; then
              echo "Error: Deployed commit does not match origin/main."
              exit 1
            fi

            echo "Deployed commit: $ACTUAL_COMMIT"

            # Add application-specific build, test, and health checks here.
            # Any command returning a non-zero exit status triggers rollback.

            echo "Verifying Git working tree..."
            if [ -n "$(git status --porcelain)" ]; then
              echo "Error: Unexpected working-tree changes remain."
              git status --short
              exit 1
            fi

            # All configured deployment checks have passed.
            trap - ERR

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"

            # Delete the backup only after successful verification.
            rm -rf "$BACKUP_ROOT"

            echo "Temporary backup removed."
